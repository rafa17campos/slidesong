[project]
name = "slidesong"
version = "0.1.0"
description = "Self-hosted app that turns Immich photos and a song into a video whose photos follow the lyrics"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.120",
  "uvicorn[standard]>=0.38",
  "python-multipart>=0.0.20",
  "psycopg[binary]>=3.2",
  "httpx>=0.28",
  "sentencepiece>=0.2",
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "pillow>=11",
  "pillow-heif>=0.20",
  "librosa>=0.11",
  "faster-whisper>=1.1",
  "anthropic>=0.75",
  "pydantic>=2.14.3",
  "opentimelineio>=0.18.1",
  "otio-fcp-adapter>=1.0.0",
]

[project.optional-dependencies]
# GPU worker (Windows + NVIDIA, e.g. an RTX 2070): cuBLAS 12 for GPU faster-whisper (cuDNN ships with ctranslate2)
gpu = [
  "nvidia-cublas-cu12>=12.8,<12.9.3; sys_platform == 'win32'",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
