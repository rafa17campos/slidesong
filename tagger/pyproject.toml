[project]
name = "slidesong-tagger"
version = "0.1.0"
description = "Object/scene tags per photo with RAM++ (Recognize Anything), run on the GPU worker"
license = "AGPL-3.0-only"
requires-python = ">=3.11,<3.12"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers==4.36.2",
  "timm==0.4.12",
  "fairscale==0.4.4",
  "scipy",
  "pillow",
  "httpx",
  "huggingface_hub<0.26",
  "ftfy",
  "regex",
  "ram @ git+https://github.com/xinyu1205/recognize-anything.git",
  "clip @ git+https://github.com/openai/CLIP.git",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv]
override-dependencies = ["pycocoevalcap; sys_platform == 'never'"]
