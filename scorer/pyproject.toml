[project]
name = "slidesong-scorer"
version = "0.1.0"
description = "Per-photo quality scores for Slidesong (aesthetics, sharpness, face expressions), run on the GPU worker"
license = "AGPL-3.0-only"
requires-python = ">=3.12"
dependencies = [
  "torch>=2.6",
  "torchvision>=0.21",
  "transformers>=4.45",
  "accelerate>=0.30",
  "aesthetic-predictor-v2-5>=2024.12.18",
  "mediapipe>=0.10.20",
  "pillow>=11",
  "pillow-heif>=0.20",
  "numpy>=2",
  "httpx>=0.28",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
